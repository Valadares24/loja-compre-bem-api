spring.application.name=comprebem
server.port=8080

# H2 Database em memória
spring.datasource.url=jdbc:h2:mem:comprebemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações de Paginação (Pageable: padrão 20, máximo 50)
spring.data.web.pageable.serialization-mode=via_dto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Swagger UI disponível em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Exibir mensagem de erro nas respostas (ex: 404 Not Found)
server.error.include-message=always

